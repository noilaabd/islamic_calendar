{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Taqweem — Исламский календарь{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/index.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="main-bg">
    <nav class="navbar navbar-expand-lg navbar-light glass-effect shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                <img src="{% static 'images/logo.png' %}" alt="Logo" class="rounded-circle me-2" width="40" height="40">
                <span class="fw-bold text-dark">Taqweem</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-center">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'hijri_calendar' %}">Календарь</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'converter' %}">Конвертер</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'events' %}">События</a></li>
                    <li class="nav-item"><a class="nav-link" href="/quran/">Коран</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="glass-effect py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-dark opacity-75">© 2026 Taqweem. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
